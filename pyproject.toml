[project]
name = "stock-price-prediction"
version = "0.1.0"
description = "Deep-learning sequence-model benchmark for stock price forecasting (LSTM/GRU/Transformer vs. classical baselines)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
